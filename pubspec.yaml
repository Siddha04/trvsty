name: trusty
description: "Trusty - Verify with Confidence. A universal background verification platform for India."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Dependency injection
  get_it: ^7.7.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_crashlytics: ^4.0.1
  firebase_analytics: ^11.0.1

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Secure storage & encryption
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Verification
  mobile_scanner: ^5.1.1
  xml: ^6.5.0
  image_picker: ^1.1.2

  # Payment
  razorpay_flutter: ^1.3.7

  # PDF & sharing
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0

  # Utilities
  permission_handler: ^11.3.1
  logger: ^2.3.0
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
  # The Poppins font family is fetched at runtime via the `google_fonts`
  # package, so no font files need to be bundled here.
